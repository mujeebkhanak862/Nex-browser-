
name: Build Nex Browser APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract project ZIP
        run: |
          unzip -o Nex-Browser-GitHub-APK-Ready.zip -d extracted
          echo "=== Extracted files ==="
          find extracted -maxdepth 4 -type f | head -200

      - name: Locate Gradle wrapper
        id: locate
        run: |
          WRAPPER=$(find extracted -type f -name gradlew -print -quit)
          if [ -z "$WRAPPER" ]; then
            echo "ERROR: gradlew ZIP mein nahi mila."
            echo "ZIP contents:"
            unzip -l Nex-Browser-GitHub-APK-Ready.zip | head -100
            exit 1
          fi
          PROJECT_DIR=$(dirname "$WRAPPER")
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          chmod +x "$WRAPPER"
          echo "Gradle project: $PROJECT_DIR"

      - name: Build Debug APK
        working-directory: .
        run: |
          cd "${{ steps.locate.outputs.project_dir }}"
          ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nex-browser-debug-apk
          path: extracted/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
