
name: Build Nex Browser APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Check project files
        run: |
          ls -la
          ls -la DevilBrowser
          test -f DevilBrowser/gradlew
          test -f DevilBrowser/settings.gradle

      - name: Build Debug APK
        working-directory: DevilBrowser
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nex-browser-debug-apk
          path: DevilBrowser/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
